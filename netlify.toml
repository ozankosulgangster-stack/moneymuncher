[build]
  publish = "."
  functions = "netlify/functions"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api?path=:splat"
  status = 200

[[redirects]]
  from = "/kids"
  to = "/kids/index.html"
  status = 200

[[redirects]]
  from = "/kids/"
  to = "/kids/index.html"
  status = 200

[[redirects]]
  from = "/kids/play"
  to = "/kids/play/index.html"
  status = 200

[[redirects]]
  from = "/kids/play/"
  to = "/kids/play/index.html"
  status = 200

[[redirects]]
  from = "/kids/community"
  to = "/kids/community.html"
  status = 200

[[redirects]]
  from = "/kids/community/"
  to = "/kids/community.html"
  status = 200

[[redirects]]
  from = "/kids/blog"
  to = "/kids/blog.html"
  status = 200

[[redirects]]
  from = "/kids/blog/"
  to = "/kids/blog.html"
  status = 200

[[redirects]]
  from = "/kids/classroom-market"
  to = "/kids/classroom-market/index.html"
  status = 200

[[redirects]]
  from = "/kids/classroom-market/"
  to = "/kids/classroom-market/index.html"
  status = 200

[[redirects]]
  from = "/kids/rewards"
  to = "/kids/rewards/index.html"
  status = 200

[[redirects]]
  from = "/kids/rewards/"
  to = "/kids/rewards/index.html"
  status = 200

[[headers]]
  for = "/kids/play/Build/*.wasm.br"
  [headers.values]
    Content-Type = "application/wasm"
    Content-Encoding = "br"

[[headers]]
  for = "/kids/play/Build/*.js.br"
  [headers.values]
    Content-Type = "text/javascript"
    Content-Encoding = "br"

[[headers]]
  for = "/kids/play/Build/*.data.br"
  [headers.values]
    Content-Type = "application/octet-stream"
    Content-Encoding = "br"
