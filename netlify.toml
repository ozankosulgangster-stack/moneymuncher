[build]
  publish = "."
  functions = "netlify/functions"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api?path=:splat"
  status = 200

[[redirects]]
  from = "/kids"
  to = "/kids/index.html"
  status = 200

[[redirects]]
  from = "/kids/"
  to = "/kids/index.html"
  status = 200

[[redirects]]
  from = "/kids/play"
  to = "/kids/play/index.html"
  status = 200

[[redirects]]
  from = "/kids/play/"
  to = "/kids/play/index.html"
  status = 200

[[redirects]]
  from = "/kids/community"
  to = "/kids/community.html"
  status = 200

[[redirects]]
  from = "/kids/community/"
  to = "/kids/community.html"
  status = 200

[[redirects]]
  from = "/kids/blog"
  to = "/kids/blog.html"
  status = 200

[[redirects]]
  from = "/kids/blog/"
  to = "/kids/blog.html"
  status = 200
