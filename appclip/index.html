<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Money Muncher Money Mission</title>
    <meta name="description" content="Try a quick Money Muncher family money mission with no sign-in required.">
    <style>
      :root { color-scheme: light; font-family: ui-rounded, "SF Pro Rounded", system-ui, sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f5efff; color: #251747; }
      main { width: min(92vw, 620px); padding: 42px; border-radius: 34px; background: linear-gradient(145deg, #6b3bf5, #321b6e); color: white; box-shadow: 0 24px 60px #432a8038; }
      .coin { display: grid; place-items: center; width: 72px; height: 72px; border-radius: 50%; background: #ffd64c; color: #251747; font-size: 38px; font-weight: 900; }
      h1 { margin: 22px 0 12px; font-size: clamp(42px, 10vw, 72px); line-height: .96; letter-spacing: -.04em; }
      p { max-width: 34rem; font-size: 20px; line-height: 1.5; color: #f1eaff; }
      a { display: inline-block; margin-top: 10px; padding: 15px 20px; border-radius: 18px; background: white; color: #5128c7; font-weight: 800; text-decoration: none; }
    </style>
  </head>
  <body>
    <main>
      <div class="coin" aria-hidden="true">$</div>
      <h1>Make one smart money move.</h1>
      <p>Open the Money Muncher App Clip for a playful 60-second money mission—no account, purchase, or financial connection required.</p>
      <a href="https://www.moneymuncher.ca/kids">Explore Money Muncher</a>
    </main>
  </body>
</html>
