# Example Nginx location for moneymuncher.ca/kids.
# Adjust the root path to match your server.

location /kids/ {
    try_files $uri $uri/ =404;
}

location ~* ^/kids/play/.*\.wasm$ {
    add_header Content-Type application/wasm;
}

location ~* ^/kids/play/.*\.data$ {
    add_header Content-Type application/octet-stream;
}

location ~* ^/kids/play/.*\.br$ {
    add_header Content-Encoding br;
}

location ~* ^/kids/play/.*\.gz$ {
    add_header Content-Encoding gzip;
}
